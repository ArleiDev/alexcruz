<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MFIT Single Phone Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1600px;
    height: 1200px;
    background: #060709;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.16) 0%, transparent 65%),
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 100% 100%, 48px 48px, 48px 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 1200px;
    height: 1100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient Glow */
  .glow-back {
    position: absolute;
    width: 750px;
    height: 850px;
    background: radial-gradient(circle, rgba(0, 255, 102, 0.28) 0%, rgba(0, 180, 80, 0.09) 45%, transparent 70%);
    filter: blur(65px);
    z-index: 1;
  }

  /* Single Centered Phone */
  .phone {
    position: relative;
    width: 500px;
    height: 1020px;
    background: #000;
    border-radius: 60px;
    padding: 14px;
    box-shadow: 
      0 45px 110px rgba(0, 0, 0, 0.95),
      0 0 0 3.5px #2C3038,
      0 0 0 7px #16181C,
      0 0 60px rgba(0, 255, 102, 0.22);
    z-index: 10;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #0D131D;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 11px;
  }

  .camera-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #111;
    border: 1px solid #222;
  }

  .sensor-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #08081a;
  }

  /* Status Bar */
  .status-bar {
    height: 56px;
    padding: 16px 30px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    z-index: 40;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  /* MFIT DASHBOARD */
  .mfit-dashboard {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #0A437B 0%, #0B223F 32%, #080F1D 100%);
    color: #fff;
    padding: 16px 26px 24px;
  }

  .mfit-brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
    margin-bottom: 24px;
  }

  .mfit-brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.04em;
    color: #fff;
  }

  .mfit-dumbbell-icon {
    width: 28px;
    height: 28px;
  }

  .profile-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 24px;
  }

  .profile-avatar-wrap {
    width: 106px;
    height: 106px;
    border-radius: 50%;
    padding: 3.5px;
    background: linear-gradient(135deg, #00FF66, #0284C7);
    box-shadow: 0 0 30px rgba(0, 255, 102, 0.45);
    margin-bottom: 12px;
  }

  .profile-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #111;
  }

  .profile-name {
    font-size: 24px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 0.01em;
  }

  .profile-cref {
    font-size: 14px;
    font-weight: 600;
    color: #93C5FD;
    letter-spacing: 0.05em;
    margin-top: 3px;
  }

  .greeting-banner {
    font-size: 17px;
    font-weight: 600;
    color: #E2E8F0;
    margin-bottom: 18px;
    padding-left: 4px;
  }

  /* 6 MFIT Buttons Grid */
  .mfit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    flex: 1;
  }

  .mfit-btn {
    background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
    border-radius: 20px;
    padding: 18px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 24px rgba(2, 132, 199, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .mfit-btn.active-btn {
    background: linear-gradient(135deg, #00FF66 0%, #059669 100%);
    color: #000;
    box-shadow: 0 12px 30px rgba(0, 255, 102, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .mfit-btn-icon {
    width: 46px;
    height: 46px;
    min-width: 46px;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mfit-btn.active-btn .mfit-btn-icon {
    background: rgba(0, 0, 0, 0.22);
  }

  .mfit-btn-label {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
  }

  .mfit-tab-bar {
    height: 70px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-top: 8px;
    margin-top: 16px;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #94A3B8;
  }

  .tab-item.active {
    color: #00FF66;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="glow-back"></div>

  <!-- SINGLE PHONE (MFIT PERSONAL DASHBOARD) -->
  <div class="phone">
    <div class="dynamic-island">
      <div class="camera-dot"></div>
      <div class="sensor-dot"></div>
    </div>
    
    <div class="phone-screen">
      <div class="status-bar">
        <span>14:35</span>
        <div class="status-icons">
          <svg width="17" height="13" viewBox="0 0 16 12" fill="white"><path d="M1 8h2v3H1zM5 5h2v6H5zM9 2h2v9H9zM13 0h2v11h-2z"/></svg>
          <span style="font-size: 13px; font-weight: 700;">5G</span>
          <svg width="22" height="13" viewBox="0 0 24 12" fill="white"><rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="1.5" fill="none"/><rect x="3" y="3" width="12" height="6" fill="white"/><path d="M21 4v4" stroke="white" stroke-width="1.5"/></svg>
        </div>
      </div>

      <div class="mfit-dashboard">
        
        <div class="mfit-brand-header">
          <div class="mfit-brand-logo">
            <svg class="mfit-dumbbell-icon" viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
            <span>MFITPERSONAL</span>
          </div>
        </div>

        <div class="profile-block">
          <div class="profile-avatar-wrap">
            <img src="assets/alex-hero.png" class="profile-avatar-img" alt="Alex Cruz">
          </div>
          <div class="profile-name">Alex Cruz</div>
          <div class="profile-cref">CREF: 009216-G/PE</div>
        </div>

        <div class="greeting-banner">
          Boa tarde, Aluno(a)!
        </div>

        <div class="mfit-grid">
          <div class="mfit-btn active-btn">
            <div class="mfit-btn-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12" stroke-linecap="round"/></svg>
            </div>
            <div class="mfit-btn-label">Treinos</div>
          </div>

          <div class="mfit-btn">
            <div class="mfit-btn-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            </div>
            <div class="mfit-btn-label">Treinos<br>Extra</div>
          </div>

          <div class="mfit-btn">
            <div class="mfit-btn-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/><polyline points="9 14 12 17 16 12"/></svg>
            </div>
            <div class="mfit-btn-label">Avaliações</div>
          </div>

          <div class="mfit-btn">
            <div class="mfit-btn-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
            <div class="mfit-btn-label">Meu<br>Progresso</div>
          </div>

          <div class="mfit-btn">
            <div class="mfit-btn-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </div>
            <div class="mfit-btn-label">Faturas</div>
          </div>

          <div class="mfit-btn">
            <div class="mfit-btn-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div class="mfit-btn-label">Arquivos</div>
          </div>
        </div>

        <div class="mfit-tab-bar">
          <div class="tab-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00FF66" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
          </div>
          <div class="tab-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            <span>Instagram</span>
          </div>
          <div class="tab-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span>WhatsApp</span>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

</body>
</html>
